<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>PatiLife — Sahne genişletme kontrolü</title><link rel="stylesheet" href="patilife_v2/classic-shell.css"><style>body{display:block;overflow:auto;height:auto;background:#e6dbc9;color:#573c2a;font:16px system-ui;margin:20px}header{max-width:1100px;margin:auto auto 12px;display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 15px;background:#fff5e4;border:1px solid #b99e77;border-radius:12px;color:#573c2a;font:inherit;cursor:pointer}#preview{position:relative;width:1100px;height:650px;overflow:hidden;margin:auto;background:#fff}#roomStage{position:absolute;top:0;left:0;width:2200px;height:650px;transform-origin:0 0}.room-bg{opacity:1}#label{width:100%;margin:0 0 6px}</style><script src="patilife_v2/chapters.js"></script><script src="patilife_v2/runtime.js"></script><script src="patilife_v2/scene-view.js"></script></head><body><header><p id="label">Sahne kontrolü · Varsayılan</p><button data-room="living">Salon</button><button data-room="kitchen">Mutfak</button><button data-room="bedroom">Yatak odası</button><button data-room="bathroom">Banyo</button><button data-room="garden">Bahçe</button><button data-room="sunroom">Kış bahçesi</button><button data-room="attic">Oyun tavanı</button><button data-room="reading">Kütüphane</button><button id="wide">Uzaklaştır: %55</button><button id="normal">Varsayılan: %100</button></header><main id="preview"><div id="roomStage"><div class="room-bg active" id="bgLiving"></div></div></main><script>
const names={living:'bgLiving',kitchen:'bgKitchen',bedroom:'bgBedroom',bathroom:'bgBathroom',garden:'bgGarden',sunroom:'bg-sunroom',attic:'bg-attic',reading:'bg-reading'},stage=document.getElementById('roomStage'),bg=stage.firstElementChild,view=PatiLifeSceneView.create({scale:1});let camera=550;
function paint(){stage.style.setProperty('--room-edge-fade',view.manual?'6%':'0%');stage.style.transform=view.transform(camera,1100,650);document.getElementById('label').textContent='Sahne kontrolü · %'+Math.round(view.scale*100);}
for(const b of document.querySelectorAll('[data-room]'))b.onclick=()=>{bg.id=names[b.dataset.room];PatiLifeRuntime.room(b.dataset.room);};
document.getElementById('wide').onclick=()=>{view.reset();view.begin({x:450,y:325},{x:650,y:325},550,1100,650);camera=view.move({x:495,y:325},{x:605,y:325},1100,650);paint();};
document.getElementById('normal').onclick=()=>{view.reset();camera=550;paint();};PatiLifeRuntime.room('living');paint();
</script></body></html>
