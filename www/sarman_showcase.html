<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 Sarman Kedi — Transparan Animasyon Stüdyosu</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0d0d14;
        --card: #151522;
        --card-border: #26263a;
        --accent: #ff6b9d;
        --accent-hover: #ff85b0;
        --text: #f0f0f8;
        --text-dim: #8888a4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg,#ff6b9d,#ffaa40); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .nav-links { display: flex; gap: 10px; }
    .nav-btn { background: #222233; color: white; border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: 700; transition: all 0.2s; }
    .nav-btn:hover { background: var(--accent); border-color: var(--accent); }
    
    /* Damalı Şeffaflık Deseni */
    .checkered-bg {
        background-color: #151522;
        background-image: linear-gradient(45deg, #1e1e30 25%, transparent 25%), linear-gradient(-45deg, #1e1e30 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1e1e30 75%), linear-gradient(-45deg, transparent 75%, #1e1e30 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    /* Top Hero Stage */
    .hero-stage { background: linear-gradient(180deg, #1c142e 0%, #0e0a19 100%); border: 1px solid var(--card-border); border-radius: 18px; padding: 24px; margin-bottom: 24px; display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: center; }
    .hero-preview { border-radius: 14px; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
    .hero-preview canvas { width: 200px; height: 200px; }
    
    .room-box { background: linear-gradient(180deg, #2b1f47 0%, #151024 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; height: 180px; position: relative; overflow: hidden; }
    .room-decor { position: absolute; bottom: 35px; left: 16px; font-size: 28px; opacity: 0.8; }
    .room-floor { position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: rgba(0,0,0,0.4); border-top: 2px solid rgba(255,107,157,0.3); }
    #roomCat { position: absolute; bottom: 10px; left: 40px; transition: bottom 0.1s ease; background: transparent; z-index: 2; }
    #roomProp { position: absolute; bottom: 12px; font-size: 28px; z-index: 1; display: none; }

    /* Controls Bar */
    .controls-bar { background: var(--card); border: 1px solid var(--card-border); padding: 12px 20px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .speed-ctrl { display: flex; align-items: center; gap: 10px; }
    input[type=range] { accent-color: var(--accent); width: 140px; }
    .val-badge { font-family: monospace; font-size: 13px; font-weight: 800; color: var(--accent); min-width: 50px; }

    /* Category Switcher */
    .tab-group { display: flex; gap: 6px; background: #0f0f17; padding: 4px; border-radius: 10px; border: 1px solid var(--card-border); }
    .tab-btn { background: transparent; border: none; color: var(--text-dim); padding: 6px 14px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent); color: white; }

    /* Grid Showcase */
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .anim-card { background: var(--card); border: 2px solid var(--card-border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.2s; position: relative; }
    .anim-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(255,107,157,0.15); }
    .anim-card.active { border-color: var(--accent); background: rgba(255,107,157,0.06); }
    
    .card-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-title { font-size: 14px; font-weight: 800; color: white; }
    .card-badge { background: #222233; color: var(--text-dim); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .card-badge.moving { background: rgba(0, 230, 118, 0.15); color: #00E676; border: 1px solid rgba(0,230,118,0.3); }
    .card-badge.static { background: rgba(255, 107, 157, 0.15); color: var(--accent); border: 1px solid rgba(255,107,157,0.3); }
    
    .canvas-box { border-radius: 10px; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.3); margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.06); }
    .canvas-box canvas { width: 150px; height: 150px; }
    
    .strip-mini { display: flex; gap: 4px; overflow-x: auto; width: 100%; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06); }
    .strip-mini canvas { width: 38px; height: 38px; border-radius: 4px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.05); }
</style>
</head>
<body>

<header>
    <h1>🐾 Sarman Kedi — Transparan Animasyon Stüdyosu</h1>
    <div class="nav-links">
        <a href="game.html" class="nav-btn" style="background: var(--accent); border-color: var(--accent);">🎮 Canlı Oyun Simülatörü</a>
        <a href="strip_editor.html" class="nav-btn">🛠️ Frame Düzenleyici</a>
        <a href="sarman_player.html" class="nav-btn">🎞️ Detaylı Oynatıcı</a>
    </div>
</header>

<!-- HERO SAHNE -->
<div class="hero-stage">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div class="hero-preview checkered-bg">
            <canvas id="heroCanvas" width="300" height="300"></canvas>
        </div>
        <div id="heroLabel" style="font-size: 15px; font-weight: 800; color: var(--accent);">1. Yürüme (Walk)</div>
    </div>

    <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="font-size: 13px; font-weight: 800; color: var(--text-dim);" id="heroRoomDesc">🏃 Oda Sahnesi: Canlı Davranış Simülasyonu</div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="nav-btn" id="btnHybridShowcase" onclick="toggleHybridShowcase()" style="padding: 4px 10px; font-size: 11px; border-color: var(--accent);">🔀 Hibrit Mod (Yürü + Zıpla): KAPALI</button>
                <div id="heroBehaviorBadge" class="card-badge moving">🏃 Hareketli</div>
            </div>
        </div>
        <div class="room-box">
            <div class="room-decor">🪴 🛋️</div>
            <div class="room-floor"></div>
            <div id="roomProp">🥣</div>
            <canvas id="roomCat" width="160" height="160"></canvas>
        </div>
    </div>
</div>

<!-- KONTROLLER -->
<div class="controls-bar">
    <div class="tab-group">
        <button class="tab-btn active" id="tabBtnSahnelerPng" onclick="switchCategory('sahneler_png')">💎 Yeni Şeffaf PNG'ler (8)</button>
        <button class="tab-btn" id="tabBtnSahnelerRaw" onclick="switchCategory('sahneler_raw')">📷 Sahneler Ham (10)</button>
        <button class="tab-btn" id="tabBtnTransparan" onclick="switchCategory('transparan')">💎 Gerçek Transparan (1-5)</button>
        <button class="tab-btn" id="tabBtnEdited" onclick="switchCategory('edited')">✨ Düzeltilmişler (1-10)</button>
    </div>

    <div class="speed-ctrl">
        <span style="font-size: 13px; font-weight: 700; color: var(--text-dim);">Animasyon Hızı (FPS):</span>
        <input type="range" id="fpsSlider" min="1" max="24" value="8" oninput="updateFps()">
        <span class="val-badge" id="fpsVal">8 FPS</span>
        <button class="nav-btn" id="playBtn" onclick="togglePlay()" style="margin-left: 8px;">⏸️ Durdur</button>
    </div>
</div>

<!-- ANİMASYON GRID -->
<div class="grid-container" id="animGrid"></div>

<script>

    sahneler_png: [
        { file: 'sahneler/sarman_duzeltilmis_lazer.png', name: '🔴 0. Lazer Zıplama (Yeni Düzeltilmiş PNG)', isMoving: true, speed: 5.5, decor: '✨', status: '🐾 Lazer Kovalıyor & Zıplıyor' },
        { file: 'sahneler/sarman_banyo.png', name: '🛁 0. Köpük Banyosu (Şeffaf PNG)', isMoving: false, speed: 0, decor: '🫧', status: '🛁 Küvette Yıkanıyor (Sabit)' },

        { file: 'sahneler/sarman_duzeltilmis_tırmalama.png', name: '🪵 5. Tırmalama (Şeffaf PNG)', isMoving: false, speed: 0, decor: '🪵', status: '🪵 Tırnak Biliyor (Sabit)' },
        { file: 'sahneler/sarman_duzeltilmis_kıvrılma.png', name: '💤 6. Kıvrılıp Uyuma (Şeffaf PNG)', isMoving: false, speed: 0, decor: '🛏️', status: '💤 Kıvrılmış Uyuyor (Sabit)' },
        { file: 'sahneler/sarman_duzeltilmis_mamakabı.png', name: '✨ 7. Mama Kabı (Şeffaf PNG)', isMoving: false, speed: 0, decor: '🐟', status: '✨ Mama Kabı (Eşya)' },
        { file: 'sahneler/mamakabı animasyonlu.png', name: '✨ 8. Mama Kabı Animasyonlu (Şeffaf PNG)', isMoving: false, speed: 0, decor: '🐟', status: '✨ Mama Dolumu (Eşya)' },
        { file: 'sahneler/sarman_duzeltilmis_sallanan oyuncak.png', name: '✨ 9. Sallanan Olta (Şeffaf PNG)', isMoving: false, speed: 0, decor: '🎣', status: '✨ Salınım (Eşya)' },
        { file: 'sahneler/susebili sprite.png', name: '💧 10. Su Sebili (Şeffaf PNG)', isMoving: false, speed: 0, decor: '💧', status: '✨ Canlı Su Akışı (Eşya)' },
        { file: 'sahneler/butonlar.png', name: '🔘 11. Mobil Butonlar (Şeffaf PNG)', isMoving: false, speed: 0, decor: '🎮', status: '✨ Arayüz İkonları (Eşya)' }
    ],
    sahneler_raw: [
        { file: 'sahneler/lazer.jpg', name: '🔴 0. Lazer & Zıplama (Ham)', isMoving: true, speed: 5.5, decor: '✨', status: '🐾 Lazer Kovalıyor (Hareketli)' },
        { file: 'sahneler/mamayerken.jpg', name: '🥣 1. Mama Yeme', isMoving: false, speed: 0, decor: '🥣', status: '🐟 Mama Yiyor (Sabit)' },
        { file: 'sahneler/suiçme.jpg', name: '💧 2. Su İçme 1', isMoving: false, speed: 0, decor: '🥣', status: '💧 Su İçiyor (Sabit)' },
        { file: 'sahneler/suiçme2.jpg', name: '💧 3. Su İçme 2', isMoving: false, speed: 0, decor: '🥣', status: '💧 Su İçiyor (Sabit)' },
        { file: 'sahneler/laze oynama.jpg', name: '🔴 4. Lazer Oyunu & Atılma', isMoving: true, speed: 5.5, decor: '✨', status: '🐾 Lazer Kovalıyor (Hareketli)' },
        { file: 'sahneler/tırmalama.jpg', name: '🪵 5. Tırmalama Hareketi', isMoving: false, speed: 0, decor: '🪵', status: '🪵 Tırnak Biliyor (Sabit)' },
        { file: 'sahneler/kıvrılma.jpg', name: '💤 6. Kıvrılıp Uyuma', isMoving: false, speed: 0, decor: '🛏️', status: '💤 Kıvrılmış Uyuyor (Sabit)' },
        { file: 'sahneler/susebili sprite.jpg', name: '✨ 7. Su Sebili (Animasyon)', isMoving: false, speed: 0, decor: '💧', status: '✨ Su Akışı (Eşya)' },
        { file: 'sahneler/mamakabı animasyonlu.jpg', name: '✨ 8. Mama Kabı (Animasyon)', isMoving: false, speed: 0, decor: '🐟', status: '✨ Mama Dolumu (Eşya)' },
        { file: 'sahneler/sallanan oyuncak.jpg', name: '✨ 9. Sallanan Olta', isMoving: false, speed: 0, decor: '🎣', status: '✨ Salınım (Eşya)' },
        { file: 'sahneler/mamakabı.jpg', name: '✨ 10. Mama Kabı (Sabit)', isMoving: false, speed: 0, decor: '🐟', status: '✨ Mama Kabı (Eşya)' },
        { file: 'sahneler/butonlar.jpg', name: '🔘 11. Mobil Butonlar (Ham)', isMoving: false, speed: 0, decor: '🎮', status: '✨ Arayüz İkonları (Eşya)' }
    ],
    transparan: [
        { file: 'sarman_transparan_1.png', name: '1. Yürüme (Walk)', isMoving: true, speed: 3.5, decor: '', status: '🏃 Oda Boyu Yürüyor' },
        { file: 'sarman_transparan_2.png', name: '2. Ayakta Duruş (Idle)', isMoving: false, speed: 0, decor: '🧶', status: '🏠 Halıda Bekliyor (Sabit)' },
        { file: 'sarman_transparan_3.png', name: '3. Kıvrılmış Uyuma (Sleep)', isMoving: false, speed: 0, decor: '🛏️', status: '💤 Yatağında Uyuyor (Sabit)' },
        { file: 'sarman_transparan_4.png', name: '4. Mama Yeme (Eat)', isMoving: false, speed: 0, decor: '🥣', status: '🐟 Mama Kabı Başında (Sabit)' },
        { file: 'sarman_transparan_5.png', name: '5. Sevilme & Yuvarlanma', isMoving: false, speed: 0, decor: '🎀', status: '💖 Halıda Yuvarlanıyor (Sabit)' }
    ],
    edited: [
        { file: 'sarman_duzeltilmis_1.png', name: '1. Yürüme (Walk)', isMoving: true, speed: 3.5, decor: '', status: '🏃 Yürüyor (Hareketli)' },
        { file: 'sarman_duzeltilmis_2.png', name: '2. Ayakta Duruş / Tıslama', isMoving: false, speed: 0, decor: '🧶', status: '🏠 Ayakta Duruş (Sabit)' },
        { file: 'sarman_duzeltilmis_3.png', name: '3. Kıvrılmış Uyuma', isMoving: false, speed: 0, decor: '🛏️', status: '💤 Uyuyor (Sabit)' },
        { file: 'sarman_duzeltilmis_4.png', name: '4. Mama Yeme (Kap Başında)', isMoving: false, speed: 0, decor: '🥣', status: '🍲 Mama Yiyor (Sabit)' },
        { file: 'sarman_duzeltilmis_5.png', name: '5. Sevilme & Sırtüstü', isMoving: false, speed: 0, decor: '🎀', status: '💖 Sevilme (Sabit)' },
        { file: 'sarman_duzeltilmis_6.png', name: '6. Mama Yeme & Çiğneme', isMoving: false, speed: 0, decor: '🥣', status: '🍲 Mama Yiyor (Sabit)' },
        { file: 'sarman_duzeltilmis_7.png', name: '7. Derin Uyku', isMoving: false, speed: 0, decor: '🛏️', status: '💤 Uyuyor (Sabit)' },
        { file: 'sarman_duzeltilmis_8.png', name: '8. Zıplama / Atılma (Pounce)', isMoving: true, speed: 5.5, decor: '✨', status: '🐾 Atılıyor (Hareketli)' },
        { file: 'sarman_duzeltilmis_9.png', name: '9. Kalpli Sevilme', isMoving: false, speed: 0, decor: '🎀', status: '💖 Sevilme (Sabit)' },
        { file: 'sarman_duzeltilmis_10.png', name: '10. Banyo & Yüz Yıkama', isMoving: false, speed: 0, decor: '✨', status: '🧼 Temizleniyor (Sabit)' }
    ]
};

let currentCat = 'sahneler_png';
let activeList = CATEGORIES.sahneler_png;
const COLS = 6;
let loadedImages = {};
let extraImages = {}; // Zıplama vb. hibrit görselleri
let selectedHeroIdx = 0;
let isPlaying = true;
let currentFrame = 0;
let animTimer = null;
let roomX = 40, roomDir = 1;

// Hibrit Durum Makinesi
let isHybridActive = false;
let hybridMode = 'walk'; // 'walk' | 'pounce'
let hybridWalkTicks = 0;
let hybridPounceFrame = 0;

function toggleHybridShowcase(){
    isHybridActive = !isHybridActive;
    const btn = document.getElementById('btnHybridShowcase');
    if(btn){
        btn.textContent = isHybridActive ? '🔀 Hibrit Mod (Yürü + Zıpla): AÇIK' : '🔀 Hibrit Mod (Yürü + Zıpla): KAPALI';
        btn.style.background = isHybridActive ? 'var(--accent)' : '#222233';
    }
    hybridMode = 'walk';
    hybridWalkTicks = 0;
    hybridPounceFrame = 0;
    const rCat = document.getElementById('roomCat');
    if(rCat) rCat.style.bottom = '10px';
}

function switchCategory(cat){
    currentCat = cat;
    activeList = CATEGORIES[cat];
    selectedHeroIdx = 0;

    const btnPng = document.getElementById('tabBtnSahnelerPng');
    if(btnPng) btnPng.classList.toggle('active', cat === 'sahneler_png');
    const btnRaw = document.getElementById('tabBtnSahnelerRaw');
    if(btnRaw) btnRaw.classList.toggle('active', cat === 'sahneler_raw');
    document.getElementById('tabBtnTransparan').classList.toggle('active', cat === 'transparan');
    document.getElementById('tabBtnEdited').classList.toggle('active', cat === 'edited');

    init();
}

function init(){
    const grid = document.getElementById('animGrid');
    grid.innerHTML = '';
    loadedImages = {};

    activeList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'anim-card' + (idx === selectedHeroIdx ? ' active' : '');
        card.onclick = () => selectHero(idx);

        const badgeClass = item.isMoving ? 'moving' : 'static';
        const badgeText = item.isMoving ? '🏃 Hareketli' : '🏠 Sabit';

        card.innerHTML = `
            <div class="card-header">
                <span class="card-title">${item.name}</span>
                <span class="card-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="canvas-box checkered-bg">
                <canvas id="cardCanvas_${idx}" width="300" height="300"></canvas>
            </div>
            <div class="strip-mini" id="stripMini_${idx}"></div>
        `;

        grid.appendChild(card);
    });

    loadAll(() => {
        renderAllMinis();
        selectHero(0);
        if(!animTimer) startLoop();
    });

    // Zıplama görselini önden yükle
    const pImg = new Image();
    pImg.src = 'sarman/sarman_duzeltilmis_8.png';
    pImg.onload = () => { extraImages['pounce'] = pImg; };
}

function loadAll(cb){
    let count = 0;
    activeList.forEach((item, idx) => {
        const img = new Image();
        img.src = item.file.startsWith('sahneler/') ? encodeURI(item.file) : encodeURI('sarman/' + item.file);
        img.onload = () => {
            loadedImages[idx] = img;
            count++;
            if(count === activeList.length && cb) cb();
        };
        img.onerror = () => {
            count++;
            if(count === activeList.length && cb) cb();
        };
    });
}

function renderAllMinis(){
    activeList.forEach((item, idx) => {
        const img = loadedImages[idx];
        if(!img) return;
        const container = document.getElementById(`stripMini_${idx}`);
        if(!container) return;
        container.innerHTML = '';

        const fw = img.width / COLS;
        const fh = img.height;

        for(let f=0; f<COLS; f++){
            const cv = document.createElement('canvas');
            cv.width = 60; cv.height = 60;
            cv.className = 'checkered-bg';
            const ctx = cv.getContext('2d');
            ctx.clearRect(0, 0, 60, 60);
            ctx.drawImage(img, f * fw, 0, fw, fh, 0, 0, 60, 60);
            container.appendChild(cv);
        }
    });
}

function selectHero(idx){
    selectedHeroIdx = idx;
    document.querySelectorAll('.anim-card').forEach((c, i) => c.classList.toggle('active', i === idx));
    const activeItem = activeList[idx];
    if(activeItem && !isHybridActive){
        document.getElementById('heroLabel').textContent = activeItem.name;
        document.getElementById('heroRoomDesc').textContent = activeItem.status;
        
        const badge = document.getElementById('heroBehaviorBadge');
        if(badge){
            badge.className = 'card-badge ' + (activeItem.isMoving ? 'moving' : 'static');
            badge.textContent = activeItem.isMoving ? '🏃 Hareketli' : '🏠 Sabit';
        }
    }
}

function renderLoop(){
    currentFrame = (currentFrame + 1) % COLS;

    // 1. Hero Canvas
    const activeItem = activeList[selectedHeroIdx];
    const hImg = loadedImages[selectedHeroIdx];
    if(hImg && activeItem){
        const hCv = document.getElementById('heroCanvas');
        const hCtx = hCv.getContext('2d');
        const fw = hImg.width / COLS;
        const fh = hImg.height;

        hCtx.clearRect(0, 0, 300, 300);
        hCtx.drawImage(hImg, currentFrame * fw, 0, fw, fh, 0, 0, 300, 300);

        // Room Cat (160x160 Geniş Alan - Sıfır Kırpma):
        const rCv = document.getElementById('roomCat');
        const rCtx = rCv.getContext('2d');
        rCtx.clearRect(0, 0, 160, 160);

        const roomBox = document.querySelector('.room-box');
        const maxW = (roomBox ? roomBox.clientWidth : 400) - 120;
        const propEl = document.getElementById('roomProp');

        if(isHybridActive){
            // 🎮 HİBRİT MOD (Biraz Yürü + Zıpla + Yürümeye Devam Et)
            const walkImg = loadedImages[0] || hImg;
            const pounceImg = extraImages['pounce'] || loadedImages[7] || hImg;
            const badge = document.getElementById('heroBehaviorBadge');

            if(hybridMode === 'walk'){
                if(badge) { badge.className = 'card-badge moving'; badge.textContent = '🚶 Adımlıyor (Yürüyüş)'; }
                document.getElementById('heroRoomDesc').textContent = 'Oda zemininde birkaç adım yürüyor...';

                const wFw = walkImg.width / COLS;
                const wFh = walkImg.height;
                rCtx.drawImage(walkImg, currentFrame * wFw, 0, wFw, wFh, 25, 25, 110, 110);

                roomX += 3.5 * roomDir;
                if(roomX > maxW) { roomDir = -1; rCv.style.transform = 'scaleX(-1)'; }
                if(roomX < 20) { roomDir = 1; rCv.style.transform = 'scaleX(1)'; }
                rCv.style.left = roomX + 'px';
                rCv.style.bottom = '10px';
                if(propEl) propEl.style.display = 'none';

                hybridWalkTicks++;
                if(hybridWalkTicks >= 18){
                    hybridMode = 'pounce';
                    hybridPounceFrame = 0;
                    hybridWalkTicks = 0;
                }
            } else if(hybridMode === 'pounce'){
                if(badge) { badge.className = 'card-badge moving'; badge.textContent = '💥 ZIPLIYOR (Atılma!)'; }
                document.getElementById('heroRoomDesc').textContent = 'Havaya zıplayıp ileri atılıyor!';

                const pFw = pounceImg.width / COLS;
                const pFh = pounceImg.height;
                const pW = 140;
                const pH = 140;
                const pOffX = 10;
                const pOffY = 10;
                rCtx.drawImage(pounceImg, hybridPounceFrame * pFw, 0, pFw, pFh, pOffX, pOffY, pW, pH);

                const jumpH = Math.sin((hybridPounceFrame / 5) * Math.PI) * 30;
                rCv.style.bottom = (10 + jumpH) + 'px';

                roomX += 6.0 * roomDir;
                if(roomX > maxW) { roomDir = -1; rCv.style.transform = 'scaleX(-1)'; }
                if(roomX < 20) { roomDir = 1; rCv.style.transform = 'scaleX(1)'; }
                rCv.style.left = roomX + 'px';

                hybridPounceFrame++;
                if(hybridPounceFrame >= COLS){
                    hybridMode = 'walk';
                    hybridWalkTicks = 0;
                    hybridPounceFrame = 0;
                    rCv.style.bottom = '10px';
                }
            }
        } else {
            // Normal Tekil Mod
            rCtx.drawImage(hImg, currentFrame * fw, 0, fw, fh, 25, 25, 110, 110);
            rCat = rCv;
            rCv.style.bottom = '10px';

            if(activeItem.isMoving){
                roomX += activeItem.speed * roomDir;
                if(roomX > maxW) { roomDir = -1; rCv.style.transform = 'scaleX(-1)'; }
                if(roomX < 20) { roomDir = 1; rCv.style.transform = 'scaleX(1)'; }
                rCv.style.left = roomX + 'px';
                if(propEl) propEl.style.display = 'none';
            } else {
                const fixedX = Math.round(maxW / 2);
                rCv.style.left = fixedX + 'px';
                rCv.style.transform = 'scaleX(1)';

                if(propEl){
                    propEl.style.display = 'block';
                    propEl.textContent = activeItem.decor;
                    propEl.style.left = (fixedX - 35) + 'px';
                }
            }
        }
    }

    // 2. Tüm Card Canvas'lar
    activeList.forEach((item, idx) => {
        const img = loadedImages[idx];
        if(!img) return;
        const cv = document.getElementById(`cardCanvas_${idx}`);
        if(!cv) return;
        const ctx = cv.getContext('2d');
        const fw = img.width / COLS;
        const fh = img.height;

        ctx.clearRect(0, 0, 300, 300);
        ctx.drawImage(img, currentFrame * fw, 0, fw, fh, 0, 0, 300, 300);
    });
}

function startLoop(){
    const fps = parseInt(document.getElementById('fpsSlider').value);
    animTimer = setInterval(() => {
        if(isPlaying) renderLoop();
    }, 1000 / fps);
}

function updateFps(){
    const fps = document.getElementById('fpsSlider').value;
    document.getElementById('fpsVal').textContent = fps + ' FPS';
    clearInterval(animTimer);
    startLoop();
}

function togglePlay(){
    isPlaying = !isPlaying;
    document.getElementById('playBtn').textContent = isPlaying ? '⏸️ Durdur' : '▶️ Oynat';
}

window.onload = () => switchCategory('transparan');
</script>
</body>
</html>
